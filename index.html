<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSpace - Smart Personal Safety</title>
    <!-- We can use a CDN for Bootstrap as an alternative to local libs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/alerts.css">
</head>
<body class="bg-dark text-light">
    <div id="app" class="container mt-5">
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-gradient">SafeSpace</h1>
            <p class="lead">Smart Personal Safety & Emergency Assistance</p>
        </header>

        <main>
            <!-- SOS Button Area -->
            <section class="text-center mb-5">
                <button id="sos-btn" class="btn btn-danger rounded-circle sos-button pulse-animation">
                    SOS
                </button>
            </section>

            <!-- Status and Contacts Area -->
            <section id="status-area" class="mb-4">
                <!-- Status will be rendered here -->
            </section>
        </main>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/xmlHandler.js"></script>
    <script src="js/geolocation.js"></script>
    <script src="js/dom.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
